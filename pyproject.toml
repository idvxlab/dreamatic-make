[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamatic-product-model"
version = "0.1.0"
description = "Offline product contracts, compilation, and lightweight simulation"
requires-python = ">=3.11"
dependencies = ["pydantic==2.14.0"]

[project.scripts]
dreamatic-model = "model.cli:main"

[tool.setuptools.packages.find]
include = ["model*"]
exclude = ["model.tests*"]

[tool.setuptools.package-data]
model = ["examples/*.json", "README.md"]
